name: Registrar y evaluar pronosticos MatchLab
on:
  workflow_dispatch:
  schedule:
    - cron: '45 8,20 * * *'
permissions:
  contents: write
concurrency:
  group: matchlab-prediction-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guardar pronosticos previos y evaluar resultados
        run: python scripts/record_predictions.py
      - name: Publicar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prediction_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar predicciones y resultados MatchLab"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
