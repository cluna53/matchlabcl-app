name: Check player statistics coverage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check API-Football free coverage
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/check_player_coverage.py
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-player-coverage
          path: data/player_coverage_diagnostic.json
